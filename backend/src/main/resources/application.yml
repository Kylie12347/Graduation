server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  datasource:
    # 默认使用文件型H2，重启后保留订单和库存；不要求安装数据库。
    url: jdbc:h2:file:./data/cabinet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
  h2:
    console:
      enabled: false
app:
  # 本地教学演示账号；部署到局域网前设置环境变量，不要将真实密码提交Git。
  admin-password: ${ADMIN_PASSWORD:admin123}
  zone: Asia/Shanghai
